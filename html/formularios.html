<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./html.svg">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <form action="">
        <input placeholder="Seu nome:" type="text" name="" id="" />
        <br />
        <label for="email">Seu e-mail:</label>
        <input type="email" name="" id="email" />
        <br />
        <input placeholder="Seu telefone:" type="tel" name="" id="" />
        <br />
        <input max="10" min="1" type="number" name="" id="" />
        <input step="2" max="10" type="number" name="" id="" />
        <br />
        <input type="file" name="" id="" />
        <br />
        <input type="color" name="" id="" />
        <br />
        <input type="checkbox" name="" id="checkbox" />
        <label for="checkbox">Aceito os termos</label>
        <br />
        <p>
            Qual sua cor favorita?
        </p>
        <label for="cor-vermelho">Vermelha</label>
        <input type="radio" name="cor-favorita" id="cor-vermelho" />
        <label for="cor-verde">Verde</label>
        <input type="radio" name="cor-favorita" id="cor-verde" />
        <label for="cor-azul">Azul</label>
        <input type="radio" name="cor-favorita" id="cor-azul" />
        <br />
        <label for="">Qual seu filme favorito?</label>
        <select name="" id="">
            <option value="">Filme A</option>
            <option value="">Filme B</option>
            <option value="">Filme C</option>
        </select>
        <label for="">Qual sua série favorita?</label>
        <select multiple name="" id="">
            <option value="">Série A</option>
            <option value="">Série B</option>
            <option value="">Série C</option>
        </select>
        <br />
        <textarea name="" id=""></textarea>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <br />
    </form>
    <hr />
    <a href="./label.html">Ir para página de Label</a>
</body>
</html>
